<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Enhanced graphics check</title>
  <script type="importmap">
    { "imports": { "#three": "./vendor/three.module.js" } }
  </script>
  <style>
    body {
      margin: 0;
      background: #10151a;
      color: #ddd;
      font: 14px monospace;
    }
    header {
      padding: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      font: inherit;
      padding: 9px;
    }
    #stage {
      position: relative;
      width: min(100vw, 1200px);
      aspect-ratio: 8/5;
      margin: auto;
    }
    canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    canvas.enhanced-graphics {
      image-rendering: auto;
    }
    #state {
      display: block;
      padding: 10px;
      text-align: center;
    }
  </style>
  <header>
    <button id="enhanced">Enhanced</button><button id="native">Native</button
    ><button id="fire">Fire</button><button id="explode">Explosion</button
    ><button id="jump">Jump</button><button id="slow">30 FPS</button
    ><button id="fast">60 FPS</button>
  </header>
  <div id="stage"><canvas id="world" width="320" height="200"></canvas></div>
  <output id="state"></output>
  <script type="module" src="enhanced-effects-check.js"></script>
</html>
