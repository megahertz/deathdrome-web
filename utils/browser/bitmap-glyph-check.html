<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Bitmap glyph isolation check</title>
  <style>
    body {
      margin: 16px;
      background: #18212a;
      color: #eee;
      font: 14px monospace;
    }
    canvas {
      display: block;

      margin: 10px 0;
      max-width: 100%;

    .fail {
