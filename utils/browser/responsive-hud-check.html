<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Responsive HUD check</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#13202a;color:#fff;font:12px monospace}#stage{position:fixed;inset:0;background:linear-gradient(160deg,#172736,#24333b 50%,#11191d)}canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}.responsive-hud-safe-area{position:fixed;inset:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}#toolbar{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);padding:10px;background:#000c;text-align:center;z-index:2}.reserved{position:fixed;bottom:10px;display:grid;place-items:center;border:1px dashed #739d68;color:#9cb092;background:#172a1733;text-align:center;pointer-events:none}.reserved.left{left:12px}.reserved.right{right:12px}</style>
<div id="stage"><canvas id="overlay"></canvas></div><div id="toolbar"><label><input id="touch" type="checkbox" checked> Touch layout</label><label><input id="warning" type="checkbox"> Warning</label><p id="state"></p>Authored layout fixture. Dashed zones reserve space for touch controls.</div><div class="reserved left">JOYSTICK<br>RESERVED</div><div class="reserved right">ACTION BUTTONS<br>RESERVED</div>
<script type="module">
import {ResponsiveHud} from './responsive-hud.js';
const hud=new ResponsiveHud(),stage=document.querySelector('#stage'),ctx=document.querySelector('canvas').getContext('2d'),touch=document.querySelector('#touch'),images=new Map();
const player={id:0,x:0,y:0,z:0,yaw:0,health:87,kills:1,selectedWeapon:0,weapons:[null,'Missile',null,null],keyring:{x:true},zoneMask:1};
const sim={runners:[player,{id:1,x:12,y:0,z:-15,health:70,zoneMask:1}],player:0,lives:3,time:186.3,requiredKills:2,score:123400,round:1,countdown:0};
function picture(name){if(!images.has(name)){const image=new Image();image.src='assets/'+name+'.png';images.set(name,image)}return images.get(name)}
function draw(){requestAnimationFrame(draw);const layout=hud.layout(stage,touch.checked);hud.draw(ctx,sim,0,{picture,messages:[],now:0,warning:document.querySelector('#warning').checked?{active:true,shade:'h'}:null},layout);
 for(const zone of document.querySelectorAll('.reserved')){zone.hidden=!touch.checked;zone.style.width=zone.style.height=(layout.touchReserve-16)+'px';zone.style.display=touch.checked?'grid':'none'}
 document.querySelector('#state').textContent=`${innerWidth}×${innerHeight} · HUD ${layout.top.scale.toFixed(2)} / ${layout.bottom.scale.toFixed(2)} · ${layout.bottom.x+1e-8>=layout.touchReserve?'clear':'portrait raised'}`;
}requestAnimationFrame(draw);
</script></html>
