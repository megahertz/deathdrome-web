<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  />
  <title>Responsive HUD check</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="touch-controls.css" />
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #13202a;
      color: #fff;
      font: 12px monospace;
    }
    #stage {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #172736, #24333b 50%, #11191d);
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      pointer-events: none;
    }
    .responsive-hud-safe-area {
      position: fixed;
      inset: 0;
      visibility: hidden;
      pointer-events: none;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
        env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }
    #toolbar {
      position: fixed;
      left: 50%;
      top: 35%;
      transform: translate(-50%, -50%);
      padding: 10px;
      background: #000c;
      text-align: center;
      z-index: 21;
    }
    .fixture-touch #touch-controls:not([hidden]) {
      display: block;
    }
    .fixture-paused #toolbar {
      display: none;
    }
  </style>
  <div id="stage" class="enhanced-viewport">
    <canvas id="overlay"></canvas>
    <div id="menu" hidden aria-label="Mobile pause menu"></div>
  </div>
  <div id="toolbar">
    <label><input id="touch" type="checkbox" checked /> Touch controls</label
    ><label><input id="paused" type="checkbox" /> Pause menu</label
    ><label><input id="warning" type="checkbox" /> Warning</label
    ><label
      >Cutout
      <select id="cutout">
        <option value="none">None</option>
        <option value="left">Left</option>
        <option value="right">Right</option>
      </select></label
    ><button id="fullscreen">Fullscreen</button>
    <p id="state"></p>
    Production HUD and controls at a supplied game state.
  </div>
  <script type="module" src="responsive-hud-check.js"></script>
</html>
